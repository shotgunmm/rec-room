{if embed:form_name == 'book-event'}
<section id="book-event" class="event-contact py-5">
{/if}
{exp:form_builder:form name="{embed:form_name}" class="row contact-form" id="{embed:form_name}"}
<div class="container"{if embed:form_name == 'book-event'} style="max-width: 740px"{/if}>
  <div class="row g-3">
  {fields}
    {if field_header}
    <div class="col-md-12 text-center mb-4">
      <h2>{field_header}</h2>
    </div>
    {/if}
    {field_html}
  {/fields}
  <div class="col-md-12 mt-4 form-field" style="display: none">
    <div class="alert alert-danger form-error"></div>
    </div>
    <div class="col-12 text-center mt-4 pt-3">
      <button class="cta border-0 after-star d-inline-flex align-items-center justify-content-center rounded-3 py-2 px-4 text-uppercase text-decoration-none" type="submit">
        Submit <span class="star"><img src="/images/yellow-star.svg" alt="" loading="lazy" width="42" height="42"></span>
      </button>
    </div>

  </div>
</div>
{/exp:form_builder:form}
{if embed:form_name == 'book-event'}
</section>
{/if}
